name: CI

# Build + test on Linux and Windows, and (on version tags / manual dispatch)
# package the Windows installer. The deb/Flatpak/RPM artifacts are still
# produced out-of-band on the Linux release VMs.
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Pinned, not -latest: the codec plugins target FFmpeg 8 APIs (opaque
    # SwsContext, avcodec_get_supported_config, AV_CODEC_CONFIG_*). ubuntu-latest
    # is Ubuntu 24.04, whose apt FFmpeg is 6.1 and cannot build this tree.
    # ubuntu-26.04 ships FFmpeg 8.0.1 and matches the development box (GCC 15.2,
    # Qt 6.10), so "green locally" and "green here" test the same thing.
    name: Linux (ubuntu-26.04, release)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            qt6-base-dev libgl1-mesa-dev libxkbcommon-dev \
            ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev

      # Guard the toolchain assumption explicitly. Without this, an older FFmpeg
      # on a changed runner image surfaces as dozens of "unknown type name"
      # errors from the plugin sources rather than one actionable line.
      - name: Verify FFmpeg version
        run: |
          ver=$(pkg-config --modversion libavcodec)
          major=${ver%%.*}
          echo "libavcodec $ver"
          if [ "$major" -lt 8 ]; then
            echo "::error title=FFmpeg too old::libavcodec $ver found, 8 required."
            echo "::error::The codec plugins use FFmpeg 8 APIs; ubuntu-26.04"
            echo "::error::provides them via apt. Do not 'fix' this by pinning"
            echo "::error::the runner back to -latest (Ubuntu 24.04 = FFmpeg 6.1)."
            exit 1
          fi

      # gtest + nlohmann_json are resolved by CMake (FetchContent / vendored
      # third_party), so no extra packages are needed for the test framework.
      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release --parallel

      # UI tests run headless; the offscreen platform plugin ships with qtbase.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset linux-release

  windows:
    # MSVC is the toolchain the Windows release is built and verified with, so
    # the job name says so: this job must never build with MinGW.
    name: Windows (windows-latest, MSVC, release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64

      # Gyan's *shared* build provides the import libs, headers and runtime
      # DLLs that FindFFmpeg.cmake expects (include/ + lib/ + bin/).
      - name: Install FFmpeg (shared)
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ffmpeg.7z"
          & "$env:ProgramFiles\7-Zip\7z.exe" x "$env:RUNNER_TEMP\ffmpeg.7z" `
            -o"$env:RUNNER_TEMP\ffmpeg" -y | Out-Null
          $root = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory |
                   Select-Object -First 1).FullName
          "FFMPEG_ROOT=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
          # The windows presets read $env{QT_ROOT}; pin it to the action's root.
          "QT_ROOT=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV

      # windows-latest ships VS2022 *and* gcc/MSYS2, and with the preset's
      # "generator": "Ninja" CMake picks whichever compiler is first on PATH --
      # gcc. That then links GCC objects against the MSVC-built Qt from
      # install-qt-action and dies on __imp_* undefined references. Putting the
      # VS2022 x64 native tools first makes the Ninja generator drive cl.exe,
      # which is the toolchain the Windows release is built and verified with
      # (MSVC + Qt 6.8.3). This mirrors what packaging/windows/build_installer.ps1
      # already does via vswhere + vcvars64.bat; the preset needs no change.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --parallel

      # The windows test preset already sets QT_QPA_PLATFORM=offscreen.
      - name: Test
        run: ctest --preset windows-release

  windows-package:
    # Produces the real NSIS installer + portable zip via
    # packaging/windows/build_installer.ps1, so the shipped version number can
    # no longer be a hand-maintained guess.
    #
    # Not run on every push: it reconfigures, rebuilds, re-runs the full test
    # suite and emits ~120 MB of artifacts. Trigger it on a `v*` tag or from the
    # Actions UI (workflow_dispatch) when you want an installer.
    #
    # NSIS's own makensis.exe has no version resource, so the drift guard below
    # asserts on the app exe's FILEVERSION (via version.rc.in) and on the
    # installer's filename -- not on the installer's version metadata.
    name: Windows package (installer + portable zip)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64

      - name: Install FFmpeg (shared)
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ffmpeg.7z"
          & "$env:ProgramFiles\7-Zip\7z.exe" x "$env:RUNNER_TEMP\ffmpeg.7z" `
            -o"$env:RUNNER_TEMP\ffmpeg" -y | Out-Null
          $root = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory |
                   Select-Object -First 1).FullName
          "FFMPEG_ROOT=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
          "QT_ROOT=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV

      - name: Install NSIS
        # 7-Zip is preinstalled on the runner; build_installer.ps1 expects it at
        # "$env:ProgramFiles\7-Zip\7z.exe" for the portable zip.
        run: choco install nsis --no-progress -y

      # Same reason as the windows job above: without the VS2022 x64 native
      # tools first on PATH the Ninja preset picks gcc and dies linking
      # against the MSVC-built Qt.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, test and package
        shell: pwsh
        # -Preset is passed explicitly so the "Verify version numbering" step
        # below, which looks the built exe up under this preset's build dir,
        # cannot drift from what was actually built.
        run: ./packaging/windows/build_installer.ps1 -Preset windows-release

      # This is the guard that would have caught the 1.7.38 release shipping an
      # exe whose VS_FIXEDFILEINFO still read 1.0.1.0.
      - name: Verify version numbering
        shell: pwsh
        run: |
          $src = Get-Content CMakeLists.txt -Raw
          if ($src -notmatch '(?m)^\s*VERSION\s+(\d+(?:\.\d+)+)') {
            throw 'Could not read project(VERSION ...) from CMakeLists.txt'
          }
          $version = $Matches[1]
          # version.rc appends BL_VERSION_BUILD (4th component) to the three
          # CMake components; it defaults to 0.
          $expected = "$version.0"

          $exe = Get-ChildItem `
            'build\windows\windows-release\src\ui\bucharest-lite.exe' `
            -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'bucharest-lite.exe was not produced.' }

          $fi = (Get-Item $exe.FullName).VersionInfo
          # The resource's *string* fields carry the 3-part project version, so
          # only the numeric FILEVERSION/PRODUCTVERSION append the build
          # component (0). Compare each against what it actually holds.
          $numeric = "$($fi.FileMajorPart).$($fi.FileMinorPart).$($fi.FileBuildPart).$($fi.FilePrivatePart)"
          "project version : $version"
          "app FileVersion : $($fi.FileVersion)"
          "app ProductVer. : $($fi.ProductVersion)"
          "app numeric     : $numeric"

          if ($fi.FileVersion -ne $version) {
            throw "bucharest-lite.exe FileVersion is '$($fi.FileVersion)', expected '$version'."
          }
          if ($fi.ProductVersion -ne $version) {
            throw "bucharest-lite.exe ProductVersion is '$($fi.ProductVersion)', expected '$version'."
          }
          if ($numeric -ne $expected) {
            throw "bucharest-lite.exe numeric FILEVERSION is '$numeric', expected '$expected'."
          }

          $setup = Get-ChildItem `
            'packaging\windows\*-windows-x64-setup.exe' `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw 'No setup.exe was produced.' }
          if ($setup.Name -notlike "*-$version-windows-x64-setup.exe") {
            throw "Installer is named '$($setup.Name)', expected 'bucharest-lite-$version-windows-x64-setup.exe'."
          }

          $zip = Get-ChildItem `
            'packaging\windows\*-windows-x64-portable.zip' `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) { throw 'No portable zip was produced.' }
          if ($zip.Name -notlike "*-$version-windows-x64-portable.zip") {
            throw "Portable zip is named '$($zip.Name)', expected 'bucharest-lite-$version-windows-x64-portable.zip'."
          }

          Write-Host "OK. Exe metadata and both artifact names report $version."

      - name: Upload installer and portable zip
        uses: actions/upload-artifact@v4
        with:
          name: bucharest-lite-windows-${{ github.run_number }}
          path: |
            packaging/windows/*-windows-x64-setup.exe
            packaging/windows/*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30
